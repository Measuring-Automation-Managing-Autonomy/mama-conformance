name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fixtures:
    name: Fixtures pass against pinned schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Clone source repos at pinned commits
        run: |
          python3 - <<'PY'
          import json, subprocess
          pins = json.load(open("pins.json"))
          for repo, sha in pins.items():
              if repo == "note":
                  continue
              subprocess.run(
                  ["git", "clone", "--quiet", f"https://github.com/Measuring-Automation-Managing-Autonomy/{repo}.git", repo],
                  check=True,
              )
              subprocess.run(["git", "-C", repo, "checkout", "--quiet", sha], check=True)
              print(f"{repo} @ {sha[:7]}")
          PY
      - name: Run conformance checker
        run: python3 tools/check.py --repos-dir .
